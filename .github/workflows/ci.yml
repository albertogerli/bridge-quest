name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # ESLint non è ancora un gate: la migrazione alle regole react-hooks v6
      # ha lasciato ~1.100 errori pregressi (baseline nota, vedi README).
      # Quando il debito sarà azzerato, aggiungere: npm run lint
