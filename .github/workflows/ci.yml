name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Unit tests
        run: npm test

      # Il build cattura una classe di errori che typecheck e test non vedono:
      # RSC, «server-only» importato dal client, e la configurazione — è così
      # che era passata in produzione una CSP che bloccava il WebAssembly del
      # double dummy, rompendo l'analisi delle mani senza che nessuna prova se
      # ne accorgesse.
      - name: Build
        run: npm run build
        env:
          # Valori finti se i segreti non ci sono: il build non parla col
          # database — e da oggi non deve nemmeno poterlo fare, perché la mappa
          # del sito ripiega sulle sole rotte statiche invece di far cadere
          # tutto. Le chiavi vere restano preferibili (build più fedele), ma
          # non sono un requisito per far girare la CI su un fork.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://esempio.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'chiave-finta-solo-per-il-build' }}

      # Il precache del service worker si costruisce al build su `public/`, e lì
      # dentro ci sono 169 MB di video: finivano dentro, e il worker se li
      # scaricava durante l'installazione mentre l'utente aspettava la prima
      # pagina (256 secondi misurati in produzione il 17/08/2026). L'esclusione
      # sta in `next.config.ts`; questo controlla il file generato, perché è
      # l'unico modo di accorgersi se un aggiornamento di Serwist la ignora.
      - name: Il service worker non precarica i video
        run: node scripts/verifica-sw.mjs

      # La traduzione inglese la fa una macchina, quindi sbaglia sempre allo
      # stesso modo: un controllo sui termini di bridge trova per pattern ciò
      # che una rilettura non troverebbe su 1.600 frasi. Una parola sbagliata
      # in un testo didattico non è un refuso, è una regola sbagliata.
      - name: La terminologia inglese di bridge
        run: node scripts/verifica-terminologia.mjs

      # Una frase passata da `t()` senza traduzione non rompe niente in
      # italiano: si vede solo sotto `/en`, dove non guarda nessuno finché non
      # ci arriva un utente vero. È per questo che il dizionario resta indietro
      # senza che nessuno se ne accorga, ed è per questo che serve un gate e non
      # una regola scritta.
      - name: Ogni frase ha il suo inglese
        run: node scripts/stringhe-da-tradurre.mjs --controlla
