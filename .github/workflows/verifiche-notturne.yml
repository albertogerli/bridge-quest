# Disposable local Supabase: no cloud credentials, real users or BEN traffic.
name: Verifiche notturne

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifiche:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Install dependencies
        run: npm ci
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start disposable database and auth
        run: supabase start --exclude studio,postgres-meta,edge-runtime,logflare,vector,supavisor,imgproxy
      - name: Restore schema and editorial-only fixture
        run: node scripts/quality-local.mjs seed
      - name: Check backup fidelity
        run: |
          node scripts/quality-local.mjs sql scripts/sql/test-schema-reconstruction.sql
          node scripts/quality-local.mjs sql scripts/sql/test-schema-identity.sql
      - name: Row security and Realtime
        run: |
          node scripts/quality-local.mjs rls
          node scripts/quality-local.mjs realtime
      - name: Build against local fixture
        run: node scripts/quality-local.mjs build
      - name: Browser, accessibility and user flows
        run: node scripts/quality-local.mjs e2e
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-quality-reports
          path: |
            playwright-report/
            test-results/
            docs/attuazione-qualita-2026-09-23/verifiche/locale-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup
